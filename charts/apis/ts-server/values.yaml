# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1
revisionHistoryLimit: 1
fullnameOverride: ""
image:
  repository: repo
  tag: mytag
  pullPolicy: IfNotPresent
  resources: {}
    # requests:
    #   cpu: 200m
  #   memory: 300Mi
  #  readinessProbe: {}
  # Example (replace readinessProbe: {} with the following):
  readinessProbe:
    httpGet:
      path: /ready
      port: 3000
    initialDelaySeconds: 3
    periodSeconds: 5
  #  livenessProbe: {}
  #  # Example (replace livenessProbe: {} with the following)::
  livenessProbe:
    httpGet:
      path: /live
      port: 3000
    initialDelaySeconds: 40
    periodSeconds: 10
# Container probes, rendered verbatim under the container. All OFF by default
# (empty = no probe, no change for existing releases). They are TOP-LEVEL keys:
# the `image.readinessProbe` / `image.livenessProbe` blocks above are NOT read by
# the chart (legacy leftovers, kept so existing values files keep merging).
# Use the real port the app listens on (service.targetPort), not servicePort.
# Rollouts already use RollingUpdate maxUnavailable 0 / maxSurge 1 (Recreate when
# persistence.enabled), so a readinessProbe is what makes the old pod stay in
# service until the new one answers.
readinessProbe: {}
  # httpGet:
  #   path: /readyz
  #   port: 3901
  # periodSeconds: 5
  # failureThreshold: 3
livenessProbe: {}
  # httpGet:
  #   path: /healthz
  #   port: 3901
  # periodSeconds: 10
  # failureThreshold: 3
# Optional: holds off liveness/readiness until the app has booted once. Use it
# for slow starts (boot-time migrations) instead of a large initialDelaySeconds.
startupProbe: {}
  # httpGet:
  #   path: /healthz
  #   port: 3901
  # periodSeconds: 5
  # failureThreshold: 36

service:
  name: Node
  type: ClusterIP
  servicePort: 80
  targetPort: 80
  # name: Node
  # type: NodePort
  # servicePort: 3000

postgres:
  db: "oip-api"
  host: "postgres"
  replicaHost: ""
  user:
    value: ""
    fromSecret:
      name: ""
      key: ""
  password:
    value: ""
    fromSecret:
      name: ""
      key: ""

ingress:
  enabled: false
  annotations: {}
    # cert-manager.io/cluster-issuer: cluster-issuer
  # kubernetes.io/ingress.class: nginx
  hosts:
    - oip-api.local
  tls:
    - hosts:
        - oip-api.local
      secretName: oip-api-tls

podSecurityContext: {}

persistence:
  enabled: false
  size: 10Gi
  storageClass: ""
  mountPath: /data
  accessModes:
    - ReadWriteOnce

# Arbitrary extra pod volumes (Secret, ConfigMap, etc.).
# Rendered under spec.template.spec.volumes verbatim.
extraVolumes: []
# Arbitrary extra container volumeMounts. Paired with extraVolumes.
extraVolumeMounts: []

config:
  appSecretKey: ""
  appSecretName: ""
  extraEnvVars:
    TEST: "this"
  # List-form env vars (supports valueFrom.secretKeyRef / configMapKeyRef).
  # Rendered verbatim after extraEnvVars. Example:
  #   extraEnv:
  #     - name: MY_SECRET
  #       valueFrom:
  #         secretKeyRef:
  #           name: my-secret
  #           key: value
  extraEnv: []
  blockchain:
    enabled: false
    mina:
      pvKeySecretKey: "PV_KEY"
      pvKeySecretName: "mina-secrets"
  defaultPassword: changepassword