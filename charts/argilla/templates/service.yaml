apiVersion: v1
kind: Service
metadata:
  name: {{ include "argilla.fullname" . }}-service
  labels:
    {{- include "argilla.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 6900
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "argilla.name" . }}
    app.kubernetes.io/component: server