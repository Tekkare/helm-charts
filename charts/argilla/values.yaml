
# Number of server replicas
replicaCount: 1
worker:
  # Number of worker replicas
  replicaCount: 1

image:
  repository: argilla/argilla-server
  tag: latest
  pullPolicy: IfNotPresent
persistence:
  enabled: true
service:
  type: ClusterIP
  port: 6900

env:
  # Directory where Argilla stores runtime data.
  ARGILLA_HOME_PATH: "/var/lib/argilla"

  # Base URL for the server (useful when running behind a reverse proxy).
  ARGILLA_BASE_URL: "/"

  # CORS origins allowed to access the Argilla API.
  ARGILLA_CORS_ORIGINS: ""

  # Enable or disable the OpenAPI docs endpoint.
  ARGILLA_DOCS_ENABLED: "true"

  # Elasticsearch endpoint used for search functionalities.
  # Example using HTTPS and basic authentication:
  #   Replace `elasticuser` and `elasticpassword` with your Elasticsearch credentials.
  #   Ensure that your Elasticsearch endpoint is set up to accept HTTPS connections.
  ARGILLA_ELASTICSEARCH: "https://elasticuser:elasticpassword@my-secure-elasticsearch:9200"

  # Specify the search engine type ("elasticsearch" or "opensearch").
  ARGILLA_SEARCH_ENGINE: "elasticsearch"

  # Redis URL used by Argilla for background job processing.
  # If left empty, the chart defaults to using the Bitnami Redis dependency service.
  ARGILLA_REDIS_URL: ""

  # Database URL for Argilla.
  # Example using PostgreSQL with authentication:
  #   Replace `dbuser` and `dbpassword` with your actual database credentials.
  #   Ensure that your PostgreSQL instance is accessible at the provided host.
  ARGILLA_DATABASE_URL: "postgresql+asyncpg://dbuser:dbpassword@my-secure-postgres:5432/argilla"

  # Secret key used for signing API tokens.
  # **IMPORTANT:** This key must be the same across all Argilla instances.
  # To generate a secure key, run the following command in your terminal:
  #   openssl rand -hex 32
  # For example:
  #   $ openssl rand -hex 32
  #   4b825dc642cb6eb9a060e54bf8d69288fbee4904c8ac0e9af...
  ARGILLA_AUTH_SECRET_KEY: "changeme-to-a-secure-secret"

  # Owner account credentials.
  # If provided, these will be used to create the owner user on startup.
  USERNAME: "argilla"
  PASSWORD: "12345678"

  # Default API key for the owner.
  # If not provided, a new random API key will be generated.
  API_KEY: "argilla.apikey"

  # Workspace name to be created on startup.
  WORKSPACE: "default"

  # Optional flag to force reindexing of datasets on startup.
  REINDEX_DATASETS: "0"
service:
  port: 6900
# Extra environment variables can be added here.
# Any variables defined in this list will be appended to the container's environment.
extraEnv: []
# Example:
# extraEnv:
#   - name: CUSTOM_VAR
#     value: "custom value"
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    # Add any other annotations your ingress controller might require
  hosts:
    - my-argilla.example.com
  tls:
    - hosts:
        - my-argilla.example.com
      secretName: my-argilla-tls
