apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oip-directus.fullname" . }}
  labels:
    {{- include "oip-directus.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "oip-directus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "oip-directus.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{/*      serviceAccountName: {{ include "oip-directus.serviceAccountName" . }}*/}}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- if eq .Values.storage.driver "gcp" }}
          volumeMounts:
            - mountPath: /etc/config/credentials.json
              subPath: credentials.json
              name: google-storage-credentials
          {{- end }}
          env:
            - name: PORT
              value: "{{ .Values.deployment.port | default 8080 }}"
            {{- if .Values.extraEnvVars }}
            {{- tpl (toYaml .Values.extraEnvVars) $ | nindent 12 }}
            {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.deployment.port | default 8080 }}
              protocol: TCP
          {{- if (default true (.Values.deployment.startupProbe).enabled) }}
          startupProbe:
            httpGet:
              path: {{ .Values.deployment.probe.path | default "/" | quote }}
              port: http
            failureThreshold: {{ (.Values.deployment.startupProbe).failureThreshold | default 30 }}
            periodSeconds: {{ (.Values.deployment.startupProbe).periodSeconds | default 10 }}
            timeoutSeconds: {{ (.Values.deployment.startupProbe).timeoutSeconds | default 1 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.deployment.probe.path | default "/" | quote }}
              port: http
            {{- with (.Values.deployment.livenessProbe).initialDelaySeconds }}
            initialDelaySeconds: {{ . }}
            {{- end }}
            {{- with (.Values.deployment.livenessProbe).periodSeconds }}
            periodSeconds: {{ . }}
            {{- end }}
            {{- with (.Values.deployment.livenessProbe).failureThreshold }}
            failureThreshold: {{ . }}
            {{- end }}
            {{- with (.Values.deployment.livenessProbe).timeoutSeconds }}
            timeoutSeconds: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.deployment.probe.path | default "/" | quote }}
              port: http
            {{- with (.Values.deployment.readinessProbe).initialDelaySeconds }}
            initialDelaySeconds: {{ . }}
            {{- end }}
            {{- with (.Values.deployment.readinessProbe).periodSeconds }}
            periodSeconds: {{ . }}
            {{- end }}
            {{- with (.Values.deployment.readinessProbe).failureThreshold }}
            failureThreshold: {{ . }}
            {{- end }}
            {{- with (.Values.deployment.readinessProbe).timeoutSeconds }}
            timeoutSeconds: {{ . }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if eq .Values.storage.driver "gcp" }}
      volumes:
        - name: google-storage-credentials
          secret:
            secretName: {{ default "none" .Values.storage.gcp.secretName quote }}
            items:
              - key: "credentials.json"
                path: "{{ default "none" .Values.storage.gcp.key quote }}"
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
